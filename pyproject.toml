[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-trading"
version = "0.1.0"
description = "BTC perp paper-trading MVP: state -> quant -> mock-jev -> policy -> risk -> paper execution"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "pyarrow>=16.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "pydantic>=2.6,<3.0",
    "requests>=2.31",
    "websockets>=14",
]

[project.scripts]
jev = "jev_trading.live_intelligence.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ui = ["streamlit>=1.30", "pyyaml>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
