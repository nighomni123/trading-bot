verdict: GATE FAIL (honest) — the P4 probabilistic edge does NOT survive costs at any
  tested threshold: even the most selective band (thr 0.55, win 55.8%) is ~breakeven
  gross and fee-negative net. Mock-Jev adds no precision (win 48.3 vs 48.9), only
  exposure reduction. Per gates: STOP/ITERATE — do not proceed to P8.
  Iteration directions (untested, in order): larger size per trade is NOT the fix
  (costs scale with notional); candidates are lower-turnover holding (exit only on
  opposite strong signal vs every NO_ACTION), cost-aware threshold on EXPECTED gross
  (needs a return regressor, not just P(up)), or admitting the 15m edge is below the
  fee floor at this size. Test period stays frozen until an iterate shows valid profit.
